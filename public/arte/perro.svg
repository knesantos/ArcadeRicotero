<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" role="img" aria-label="El perro">
  <!-- El perro suelto: motivo transversal fichado (RES-06, RES-22: "en toda la
       mitologia solariana hay un perro"). Silueta original propia — suelto, sin citar
       la composicion de ninguna tapa. Reemplazable por un recorte real. -->
  <g fill="ivory">
    <!-- cuerpo flaco, un poco quebrado -->
    <path d="M34 62 C 30 52, 38 44, 52 44 C 68 44, 84 48, 96 46 C 102 38, 104 30, 112 26 C 118 23, 124 26, 126 32 C 128 38, 124 44, 120 48 C 122 54, 120 60, 114 64 C 104 70, 88 66, 74 68 C 62 70, 48 72, 40 68 C 36 66, 34 64, 34 62 Z"/>
    <!-- oreja parada, torcida -->
    <path d="M108 28 C 106 18, 108 10, 114 6 C 117 12, 118 20, 116 26 Z"/>
    <!-- patas largas y flacas, despareja cada una -->
    <path d="M44 68 C 42 80, 42 92, 38 104" stroke="ivory" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M58 70 C 58 82, 60 94, 58 106" stroke="ivory" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M92 68 C 94 80, 92 92, 96 104" stroke="ivory" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M106 64 C 110 76, 108 88, 112 100" stroke="ivory" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- cola en latigo -->
    <path d="M36 60 C 26 56, 18 48, 16 38 C 15 33, 18 30, 22 32" stroke="ivory" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- ojo: hueco de recorte -->
    <circle cx="114" cy="36" r="3.5" fill="black" opacity="0.55"/>
  </g>
</svg>
